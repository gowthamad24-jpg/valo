<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background: #ffe6e6;
      text-align: center;
    }

    .container {
      position: relative;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #ccc;
      position: absolute;
    }

    img {
      margin-top: 20px;
      max-width: 200px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Will you be my Valentine? ❤️</h1>
  <button id="yes">Yes</button>
  <button id="no">No</button>
  <br>
  <img id="funnyImg" src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">
</div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const img = document.getElementById("funnyImg");

  let noClicks = 0;

  noBtn.addEventListener("click", () => {
    noClicks++;

    // Move button randomly
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 200 - 100;

    noBtn.style.transform = `translate(${x}px, ${y}px)`;

    // After 3 clicks → show image
    if (noClicks >= 3) {
      img.style.display = "block";
    }
  });

  yesBtn.addEventListener("click", () => {
    document.body.innerHTML = "<h1>YAYYY ❤️</h1>";
  });
</script>

</body>
</html>
